<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SolarMix</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="stage"></canvas>

<header class="hud-top">
  <div class="title">SolarMix</div>
  <div class="meters">
    <div class="meter"><span id="in-bar"></span></div>
    <div class="meter"><span id="out-bar"></span></div>
  </div>
  <div class="status" id="ws-status">connecting…</div>
</header>

<aside class="hud-side">
  <div class="readout">
    <div><span class="lbl">FREQ</span><span id="freq-val">220 Hz</span></div>
    <div><span class="lbl">AMP</span><span id="amp-val">0%</span></div>
    <div><span class="lbl">CHAOS</span><span id="chaos-val">30%</span></div>
    <div><span class="lbl">BPM</span><span id="bpm-val">96</span></div>
  </div>
  <div class="hint">Drag the orb · up/down = amp · left/right = freq · push/pull = chaos</div>
</aside>

<footer class="hud-bot">
  <div class="presets" id="presets">
    <button data-preset="0">FREE</button>
    <button data-preset="1" class="on">AFROBEAT</button>
    <button data-preset="2">HIGHLIFE</button>
    <button data-preset="3">BLUES</button>
    <button data-preset="4">BEMBE</button>
    <button data-preset="5">DnB</button>
  </div>
  <div class="ctrls">
    <button id="play-btn" class="on">▶ DRUMS</button>
    <button id="rec-btn" class="rec">● REC</button>
  </div>
  <div class="steps" id="steps"></div>
</footer>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="app.js"></script>
</body>
</html>
