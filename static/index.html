<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SolarMix</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="stage"></canvas>

<header class="hud-top">
  <div class="title">SolarMix</div>
  <div class="meters">
    <div class="meter"><span id="in-bar"></span></div>
    <div class="meter"><span id="out-bar"></span></div>
  </div>
  <div class="status" id="ws-status">connecting…</div>
</header>

<aside class="hud-side">
  <div class="readout">
    <div><span class="lbl">FREQ</span><span id="freq-val">220 Hz</span></div>
    <div><span class="lbl">REVERB</span><span id="rev-val">0%</span></div>
    <div><span class="lbl">TAPE FB</span><span id="del-val">0%</span></div>
    <div><span class="lbl">CHAOS</span><span id="chaos-val">30%</span></div>
    <div><span class="lbl">BPM</span><span id="bpm-val">96</span></div>
  </div>
  <div class="hint">Drag orb · ↔ reverb wet · ↕ tape echo feedback · pinch/wheel = chaos. Open the MIC and it auto-records when you speak.</div>
</aside>

<footer class="hud-bot">
  <div class="presets" id="presets">
    <button data-preset="0">FREE</button>
    <button data-preset="1" class="on">AFROBEAT</button>
    <button data-preset="2">HIGHLIFE</button>
    <button data-preset="3">BLUES</button>
    <button data-preset="4">BEMBE</button>
    <button data-preset="5">DnB</button>
  </div>
  <div class="ctrls">
    <button id="mic-btn" class="mic">🎤 MIC</button>
    <button id="play-btn" class="on">▶ DRUMS</button>
    <button id="rec-btn" class="rec">● REC</button>
  </div>
  <div class="steps" id="steps"></div>
</footer>

<script type="module" src="app.js"></script>
<script nomodule>
  document.body.insertAdjacentHTML('beforeend',
    '<div style="position:fixed;inset:0;display:grid;place-items:center;background:#03060a;color:#ffd47a;font-family:system-ui;text-align:center;padding:20px;z-index:99">'+
    'Safari is too old for ES modules.<br>Please update Safari (16.4+) or use a recent browser.</div>');
</script>
</body>
</html>
