<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>tezeta</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="stage"></canvas>
<svg id="patchbay" aria-hidden="true"></svg>

<header class="hud-top">
  <div class="title">tezeta <span class="sub">ኢትዮጵያ kiñit synth</span></div>
  <div class="meters">
    <div class="meter"><span id="in-bar"></span></div>
    <div class="meter"><span id="out-bar"></span></div>
  </div>
  <div class="master">
    <div class="lbl">MASTER</div>
    <input id="master" type="range" min="0" max="1" step="0.001" value="0.7">
    <div id="master-val" class="val">70%</div>
  </div>
  <div class="status" id="ws-status">connecting…</div>
</header>

<aside class="hud-side">
  <div class="modes" id="modes">
    <button data-mode="1" class="on">TEZETA<small>nostalgic</small></button>
    <button data-mode="2">BATI<small>lively</small></button>
    <button data-mode="3">AMBASSEL<small>heroic</small></button>
    <button data-mode="4">ANCHIHOYE<small>dramatic</small></button>
  </div>
  <div class="readout">
    <div><span class="lbl">CHAOS</span><span id="chaos-val">25%</span></div>
    <div><span class="lbl">BPM</span><span id="bpm-val">88</span></div>
    <div><span class="lbl">LISS a:b:c</span><span id="liss-val">1 : 1 : 1</span></div>
  </div>
  <div class="hint">Touch on the curve to play.<br>Voices: <b>krar · masinko · washint · kebero</b>.<br>Sound emits from the Pi only.</div>
</aside>

<footer class="hud-bot">
  <div class="voices" id="voices">
    <button data-voice="0" class="v on">KRAR</button>
    <button data-voice="1" class="v">MASINKO</button>
    <button data-voice="2" class="v">WASHINT</button>
    <button data-voice="3" class="v">KEBERO</button>
  </div>
  <div class="sliders">
    <label>CHAOS <input id="chaos" type="range" min="0" max="1" step="0.001" value="0.25"></label>
    <label>BPM <input id="bpm" type="range" min="40" max="180" step="0.5" value="88"></label>
    <label>ROOT <input id="root" type="range" min="80" max="440" step="0.5" value="220"></label>
    <label>REV <input id="reverb_mix" type="range" min="0" max="1" step="0.001" value="0.25"></label>
    <label>DELAY <input id="delay_fb" type="range" min="0" max="0.92" step="0.001" value="0.4"></label>
  </div>
  <div class="ctrls">
    <button id="drum-btn" class="on">▶ KEBERO</button>
    <button id="rec-btn" class="rec">● REC</button>
  </div>
</footer>

<script type="module" src="app.js"></script>
<script nomodule>
  document.body.insertAdjacentHTML('beforeend',
    '<div style="position:fixed;inset:0;display:grid;place-items:center;background:#03060a;color:#ffd47a;font-family:system-ui;text-align:center;padding:20px;z-index:99">'+
    'Safari is too old for ES modules.<br>Please update Safari (16.4+) or use a recent browser.</div>');
</script>
</body>
</html>
