[package]
name = "solarmix"
version = "0.1.0"
edition = "2021"
description = "Real-time web-controlled audio mixer/synth for Raspberry Pi 5 with quantum-inspired modulation"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
crossbeam = "0.8"
ringbuf = "0.4"
hound = "3.5"
parking_lot = "0.12"
rand = "0.8"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
